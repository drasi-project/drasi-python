# Site configuration for the drasi-lib (Python) documentation site.
#
# This mirrors the main drasi-project/docs Hugo + Docsy setup, scoped to the
# Python library. It is published to GitHub Pages by
# .github/workflows/website.yml.

baseURL = "https://drasi-project.github.io/drasi-python/"
title = "drasi-lib for Python"
theme = "docsy"

# Attribution
author = "Copyright © contributors to Drasi, established as Drasi a Series of LF Projects, LLC"
copyright = """Copyright&nbsp;©&nbsp;Drasi&nbsp;a&nbsp;Series&nbsp;of&nbsp;LF&nbsp;Projects,&nbsp;LLC. For&nbsp;website&nbsp;terms&nbsp;of&nbsp;use,&nbsp;trademark&nbsp;policy&nbsp;and&nbsp;other&nbsp;project&nbsp;policies&nbsp;please&nbsp;see&nbsp;<a href="https://lfprojects.org/policies/">lfprojects.org/policies/</a>."""

# Language configuration
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

# Top navbar links
[[menu.main]]
    name = "PyPI"
    weight = 5
    url = "https://pypi.org/project/drasi-lib/"
    pre = "<i class='fab fa-python'></i>"
[[menu.main]]
    name = "GitHub"
    weight = 10
    url = "https://github.com/drasi-project/drasi-python"
    pre = "<i class='fab fa-github'></i>"
[[menu.main]]
    name = "Drasi.io"
    weight = 20
    url = "https://drasi.io"
    pre = "<i class='fas fa-external-link-alt'></i>"
[[menu.main]]
    name = "Discord"
    weight = 30
    url = "https://aka.ms/drasidiscord"
    pre = "<i class='fab fa-discord'></i>"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.110.0"

  # Tutorials are authored once under ../tutorials/<name>/_index.md (co-located
  # with their runnable code) and mounted into the docs content tree, so the doc
  # site and the generated GitHub READMEs stay in sync. Adding a content mount
  # disables Hugo's implicit "content -> content" default, so it is re-declared
  # here; the assets/ and layouts/ defaults are untouched.
  [[module.mounts]]
    source = "content"
    target = "content"

  [[module.mounts]]
    source = "../tutorials/getting-started"
    target = "content/docs/tutorials/getting-started"
    includeFiles = ["/_index.md", "/images/**"]

  [[module.mounts]]
    source = "../tutorials/building-comfort"
    target = "content/docs/tutorials/building-comfort"
    # Only the write-up and its images are docs; the app code is not.
    includeFiles = ["/_index.md", "/images/**"]

  [[module.mounts]]
    source = "../tutorials/curbside-pickup"
    target = "content/docs/tutorials/curbside-pickup"
    includeFiles = ["/_index.md", "/images/**"]

# UI customization
[params]
  # Built-in (offline) lunr.js search — no external service required.
  offlineSearch = true
  offlineSearchMaxResults = 10

  # "Edit this page" links point back at this repository.
  github_repo = "https://github.com/drasi-project/drasi-python"
  github_branch = "main"
  github_subdir = "website"

  # Version banner shown on every page.
  version = "pre-1.0"

[params.ui]
  sidebar_menu_compact = false
  sidebar_search_disable = false
  sidebar_menu_foldable = true
  sidebar_menu_truncate = 100
  ul_show = 1
  navbar_logo = true
  showLightDarkModeMenu = true
  [params.ui.readingtime]
    enable = true

# "Was this page helpful?" feedback widget
[params.ui.feedback]
  enable = true
  yes = 'Glad to hear it! Please <a href="https://github.com/drasi-project/drasi-python/issues/new">tell us how we can improve</a>.'
  no = 'Sorry to hear that. Please <a href="https://github.com/drasi-project/drasi-python/issues/new">tell us how we can improve</a>.'

# Links surfaced in the footer / about section.
[[params.links.user]]
  name = "PyPI"
  url = "https://pypi.org/project/drasi-lib/"
  icon = "fab fa-python"
  desc = "Install drasi-lib from PyPI"
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/drasi-project/drasi-python"
  icon = "fab fa-github"
  desc = "Source, issues and contributions"
[[params.links.developer]]
  name = "Discord"
  url = "https://aka.ms/drasidiscord"
  icon = "fab fa-discord"
  desc = "Chat with the Drasi community"

# Use git commit dates for "last modified".
[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]
